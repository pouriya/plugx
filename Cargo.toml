[package]
name = "plugx"
version = "0.1.0"
description = "Modular, extensible and observable plugin framework: namespaced hooks, C-ABI plugins"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/plugx-rs/plugx"
readme = "README.md"
homepage = "https://crates.io/crates/plugx"
documentation = "https://docs.rs/plugx"
categories = ["development-tools", "api-bindings"]
keywords = ["plugin", "hook", "extension", "ffi", "abi"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
cfg-if = "1.0.0"
libloading = { version = "0.8.5", optional = true }
log = { version = "0.4.20", optional = true }
tracing = { version = "0.1.40", optional = true }
tanzim-validate = { version = "0.13.0", optional = true, default-features = false, features = ["schema"] }

[features]
# The library-author surface (hooks, run) is always on. Everything below is
# for application authors, plugin authors, and tests.
default = []
plugin = []
host = ["plugin"]

# Loaders: where a plugin artifact comes from. One per transport.
load-file = ["host"]
load-http = ["host"]

# Runtimes: what a loaded artifact is run as. One per plugin kind.
runtime-cdylib = ["host", "dep:libloading"]
runtime-wasm = ["host"]
runtime-starlark = ["host"]
runtime-js = ["host"]

# The plugin-author side: building a plugin of that kind in Rust.
compile-cdylib = ["plugin"]

config-tanzim = ["host", "dep:tanzim-validate"]
testing = []
logging = ["dep:log"]
tracing = ["dep:tracing"]
full = ["host", "load-file", "load-http", "runtime-cdylib", "runtime-wasm", "runtime-starlark", "runtime-js", "compile-cdylib", "config-tanzim", "testing"]

[[example]]
name = "echo_plugin"
crate-type = ["cdylib"]
required-features = ["compile-cdylib"]

[[example]]
name = "caller_plugin"
crate-type = ["cdylib"]
required-features = ["compile-cdylib"]

[[example]]
name = "demo"
required-features = ["runtime-cdylib", "load-file"]

[package.metadata.docs.rs]
all-features = true
